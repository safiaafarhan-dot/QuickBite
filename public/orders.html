<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Track your QuickBite orders live, reorder a favourite, and rate what you ate." />
  <meta name="theme-color" content="#e4432d" />
  <title>My orders — QuickBite</title>
  <link rel="icon" href="images/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<a class="skip-link" href="#main">Skip to your orders</a>

<header class="site-header" id="siteHeader">
  <div class="shell header-row">
    <a class="brand" href="/"><img src="images/logo.png" alt="" width="38" height="38" /><span>QuickBite</span></a>

    <nav class="main-nav" aria-label="Main">
      <a href="index.html#menu">Menu</a>
      <a href="index.html#picks">For you</a>
      <a href="orders.html" aria-current="page">My orders</a>
      <a href="admin.html" class="admin-link" hidden>Kitchen</a>
    </nav>

    <div class="header-actions">
      <button class="icon-btn" data-theme-toggle aria-label="Switch theme">🌙</button>
      <a class="btn btn--primary btn--sm" href="index.html#menu">Order again</a>
    </div>
  </div>
</header>

<main class="shell" id="main">
  <div class="page-head">
    <h1>My orders</h1>
    <p id="ordersSubtitle">Loading your order history…</p>
  </div>

  <div class="orders-list" id="ordersList"></div>

  <div style="display:flex;justify-content:center;padding-bottom:60px">
    <button class="btn btn--ghost" id="loadMoreBtn" hidden>Load older orders</button>
  </div>
</main>

<footer class="site-footer">
  <div class="shell footer-base" style="border:0;padding-top:0">
    <span>© 2025 QuickBite. All rights reserved.</span>
    <a href="index.html#menu" style="color:var(--text-3)">Back to the menu</a>
  </div>
</footer>

<!-- Rate a dish -->
<div class="modal" id="reviewModal" role="dialog" aria-hidden="true" aria-labelledby="reviewTitle">
  <div class="modal-card modal-card--narrow">
    <div class="modal-head">
      <h2 id="reviewTitle">Rate this dish</h2>
      <button class="icon-btn" data-close-modal aria-label="Close">✕</button>
    </div>
    <form id="reviewForm" class="form">
      <div style="text-align:center">
        <img id="reviewImage" src="images/placeholder.svg" alt="" style="width:92px;height:92px;border-radius:var(--r);object-fit:cover;margin:0 auto 10px" />
        <strong id="reviewDish" style="display:block;margin-bottom:10px"></strong>
        <div class="stars" id="reviewStars" role="radiogroup" aria-label="Rating out of 5"></div>
      </div>
      <label>Comment (optional)
        <textarea name="comment" rows="3" maxlength="400" placeholder="What did you think?"></textarea>
      </label>
      <p class="form-error" id="reviewError" hidden></p>
      <button class="btn btn--primary btn--block" type="submit" id="reviewSubmit">Submit rating</button>
    </form>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>

<script src="js/api.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
