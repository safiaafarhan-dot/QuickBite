<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kitchen dashboard — QuickBite</title>
  <link rel="icon" href="images/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="shell header-row">
    <a class="brand" href="/">
      <img src="images/logo.png" alt="" width="40" height="40" /><span>QuickBite</span>
    </a>
    <nav class="main-nav" aria-label="Main">
      <a href="index.html#menu">Menu</a>
      <a href="orders.html">My orders</a>
      <a href="admin.html">Admin</a>
    </nav>
    <div class="header-actions">
      <button class="icon-btn" data-theme-toggle aria-label="Switch theme">🌙</button>
      <span class="order-when" id="whoami"></span>
    </div>
  </div>
</header>

<main class="shell" id="adminMain" hidden>
  <div class="page-head">
    <h1>Kitchen dashboard</h1>
    <p>Live orders, revenue and menu availability. Refreshes every 10 seconds.</p>
  </div>

  <div class="stat-grid" id="statGrid"></div>

  <div class="admin-grid">
    <section class="panel">
      <header class="panel-head">
        <h2>Orders</h2>
        <select class="status-select" id="orderFilter">
          <option value="live">Live orders</option>
          <option value="all">All orders</option>
          <option value="placed">Placed</option>
          <option value="preparing">Preparing</option>
          <option value="out_for_delivery">Out for delivery</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </header>
      <div class="panel-body" id="adminOrders"></div>
    </section>

    <div style="display:grid; gap:24px;">
      <section class="panel">
        <header class="panel-head"><h2>Top sellers</h2></header>
        <div class="panel-body"><ul class="top-items" id="topItems"></ul></div>
      </section>

      <section class="panel">
        <header class="panel-head"><h2>Menu &amp; pricing</h2></header>
        <div class="panel-body" id="menuAdmin"></div>
      </section>
    </div>
  </div>
</main>

<div class="shell" id="adminGate">
  <div class="gate">
    <h2 id="gateTitle">Checking your access…</h2>
    <p id="gateText">One moment.</p>
    <a class="btn btn--primary" href="index.html" id="gateLink" hidden>Back to the menu</a>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
